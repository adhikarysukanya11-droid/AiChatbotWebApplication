<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="chat-body">

<header class="nav">
  <a href="/" class="nav-brand">
    <span class="nav-dot"></span>
    NovaChat
  </a>
  <div class="nav-actions">
    <button id="clear-history" class="btn-ghost">Clear chat</button>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>

<main class="chat-shell">
  <div id="messages" class="messages"></div>

  <form id="chat-form" class="chat-form">
    <input
      id="chat-input"
      type="text"
      autocomplete="off"
      placeholder="Type a message…"
      aria-label="Type a message"
    >
    <button type="submit" class="btn-send" aria-label="Send message">➤</button>
  </form>
</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
